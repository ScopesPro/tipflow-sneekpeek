<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tipflow Sneak Peek</title>
  <style>
    body {
      font-family: sans-serif;
      background: #ffffff;
      color: #111;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #f9f9f9;
      border-radius: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      padding: 2rem;
      text-align: center;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 auto 1rem;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .goal {
      margin: 1.5rem 0;
      background: #e0e0e0;
      border-radius: 10px;
      height: 20px;
      overflow: hidden;
    }
    .goal-progress {
      background: #4caf50;
      height: 100%;
      width: 40%; /* Change this to reflect real progress */
    }
    .goal-label {
      font-size: 0.9rem;
      color: #333;
      margin-top: 0.5rem;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 2rem;
    }
    .tip-button {
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .tip-button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar"></div>
    <h1>@YourNameHere</h1>
    <p>Support my work by sending a quick tip 🙌</p>

    <div class="goal">
      <div class="goal-progress"></div>
    </div>
    <div class="goal-label">Saving for rent: $200 / $500</div>

    <div class="buttons">
      <button class="tip-button">$2 Tip</button>
      <button class="tip-button">$5 Tip</button>
      <button class="tip-button">$10 Tip</button>
    </div>
    <!-- 👇 Paste this new section below the buttons -->
<section style="margin-top: 2em; text-align: center;">
  <h3>Or enter your own tip amount</h3>
  <input 
    type="number" 
    id="customAmount" 
    placeholder="Enter amount (e.g. 5.00)" 
    style="padding: 10px; width: 200px; font-size: 16px; margin-right: 10px;"
  />
  <button 
    onclick="handleCustomTip()" 
    style="padding: 10px 20px; font-size: 16px; cursor: pointer;"
  >
    Send Tip
  </button>
</section>

<script>
  function handleCustomTip() {
    const amount = document.getElementById('customAmount').value;
    if (!amount || amount <= 0) {
      alert('Please enter a valid amount.');
      return;
    }
    alert('You entered: $' + amount + '\n\n(Real payment feature coming soon)');
    // Later we'll link this to the real Tipflow payment system
  }
</script>
  </div>
</body>
</html>
